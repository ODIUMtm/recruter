<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Штат клиники</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1f2328;--mut:#6b7280;--line:#e5e3dd;--ok:#1a7f4b;--bad:#c62828;--badbg:#fdecec;--okbg:#e8f5ee;--acc:#2f5d8a;--inb:#fff4dc;--intx:#8a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--card:#1f2226;--tx:#e8e8e6;--mut:#9aa1aa;--line:#2f343a;--ok:#5fcf93;--bad:#ff8a80;--badbg:#3a2222;--okbg:#1d3326;--acc:#7fb0e0;--inb:#3a3220;--intx:#f0c674}}
:root[data-theme="dark"]{--bg:#16181b;--card:#1f2226;--tx:#e8e8e6;--mut:#9aa1aa;--line:#2f343a;--ok:#5fcf93;--bad:#ff8a80;--badbg:#3a2222;--okbg:#1d3326;--acc:#7fb0e0;--inb:#3a3220;--intx:#f0c674}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:600px;margin:0 auto}
h1{font-size:18px;margin:4px 0 10px}
.warn{background:var(--badbg);color:var(--bad);padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum b{display:block;font-size:20px}.sum span{color:var(--mut);font-size:11px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;font-size:14px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.hd b{font-size:16px}.hd small{color:var(--mut)}
.role{border-top:1px solid var(--line);padding:8px 0}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cnt{color:var(--mut);font-size:12px}
.st{display:flex;align-items:center;gap:6px}
.st button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:18px;line-height:1}
.st span{min-width:20px;text-align:center;font-weight:600}
.tag{font-size:12px;padding:3px 8px;border-radius:10px}
.bad{background:var(--badbg);color:var(--bad)}.ok{background:var(--okbg);color:var(--ok)}.in{background:var(--inb);color:var(--intx)}
.emp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;margin-top:5px;border-radius:9px;background:var(--bg);cursor:pointer}
.emp small{color:var(--mut);display:block;font-size:12px}
.add{margin-top:8px;width:100%;padding:9px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--acc);font-size:14px}
.empty{color:var(--mut);text-align:center;padding:30px 0}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px}
.btns .pr{background:var(--acc);color:#fff;border-color:var(--acc)}.btns .dl{color:var(--bad)}
</style></head><body>
<h1>Штат клиники</h1>
<div id="warn"></div><div class="sum" id="sum"></div><div class="tabs" id="tabs"></div><div id="list"></div>
<div id="m"><div class="sheet" id="sh"></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
var UNITS=[["n-ter","Нагатинская","Терапия"],["n-sta","Нагатинская","Стационар"],["n-ana","Нагатинская","Анестезиология"],["n-inf","Нагатинская","Инфекция"],
["p-ter","Павелецкая","Терапия"],["p-sta","Павелецкая","Стационар"],["p-ana","Павелецкая","Анестезиология"],
["c-sur","Общая база","Хирургия"],["c-den","Общая база","Стоматология"]];
var ROLES=[["doc","Врачи"],["asst","Ассистенты"]],TABS=["Все","Нагатинская","Павелецкая","Общая база","Стажёры"];
var staff=[],needs={},tab="Все",tmr=null,cur=null,delArm=false;
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fd(d){if(!d)return"";var p=d.split("-");return p[2]+"."+p[1]+"."+p[0]}
function uname(id){var u=UNITS.filter(function(x){return x[0]===id})[0];return u?u[2]+" · "+u[1]:id}
function cnt(u,r,s){return staff.filter(function(e){return e.unit===u&&e.role===r&&e.status===s}).length}
function render(){
var wk=staff.filter(function(e){return e.status==="work"}).length,it=staff.length-wk,sd=0,sa=0;
UNITS.forEach(function(u){sd+=Math.max(0,(needs[u[0]+"_doc"]||0)-cnt(u[0],"doc","work"));sa+=Math.max(0,(needs[u[0]+"_asst"]||0)-cnt(u[0],"asst","work"))});
$("sum").innerHTML='<div><b>'+wk+'</b><span>работают</span></div><div><b>'+it+'</b><span>стажируются</span></div><div><b>'+(sd+sa)+'</b><span>не хватает (врачи '+sd+', асс. '+sa+')</span></div>';
$("tabs").innerHTML=TABS.map(function(t){return '<button data-t="'+t+'" class="'+(t===tab?'on':'')+'">'+t+'</button>'}).join("");
var h="";
if(tab==="Стажёры"){var L=staff.filter(function(e){return e.status==="intern"}).sort(function(a,b){return(a.internEnd||"9").localeCompare(b.internEnd||"9")});
h=L.length?L.map(function(e){return emp(e,true)}).join(""):'<div class="empty">Стажёров пока нет</div>'}
else UNITS.forEach(function(u){if(tab!=="Все"&&u[1]!==tab)return;
h+='<div class="card"><div class="hd"><b>'+u[2]+'</b><small>'+u[1]+'</small></div>';
ROLES.forEach(function(r){var w=cnt(u[0],r[0],"work"),i=cnt(u[0],r[0],"intern"),n=needs[u[0]+"_"+r[0]]||0,d=Math.max(0,n-w);
h+='<div class="role"><div class="rh"><div><b>'+r[1]+'</b> <span class="cnt">работает '+w+(i?' · стажёров '+i:'')+'</span></div>'+
'<div class="st"><span class="cnt">нужно</span><button data-n="'+u[0]+"_"+r[0]+'" data-d="-1">−</button><span>'+n+'</span><button data-n="'+u[0]+"_"+r[0]+'" data-d="1">+</button></div></div>'+
'<div style="margin-top:4px">'+(d?'<span class="tag bad">не хватает '+d+'</span>':'<span class="tag ok">'+(n?'укомплектовано':'план не задан')+'</span>')+'</div>';
staff.filter(function(e){return e.unit===u[0]&&e.role===r[0]}).sort(function(a,b){return a.name.localeCompare(b.name,"ru")}).forEach(function(e){h+=emp(e)});
h+='<button class="add" data-add="'+u[0]+'" data-r="'+r[0]+'">+ Добавить ('+r[1].toLowerCase()+')</button></div>'});
h+='</div>'});
$("list").innerHTML=h}
function emp(e,full){var intern=e.status==="intern";
return '<div class="emp" data-e="'+e.id+'"><div>'+esc(e.name)+'<small>'+(full?esc(uname(e.unit))+' · '+(e.role==="doc"?'врач':'ассистент')+' · ':'')+
(intern?'до '+(fd(e.internEnd)||'—')+(e.mentor?' · наставник '+esc(e.mentor):''):(e.start?'с '+fd(e.start):''))+'</small></div><span class="tag '+(intern?'in':'ok')+'">'+(intern?'стажёр':'работает')+'</span></div>'}
function $(i){return document.getElementById(i)}
function openM(e,unit,role){delArm=false;cur=e?e.id:null;e=e||{unit:unit,role:role,status:"work"};
var uo=UNITS.map(function(u){return '<option value="'+u[0]+'"'+(u[0]===e.unit?' selected':'')+'>'+u[2]+' · '+u[1]+'</option>'}).join("");
$("sh").innerHTML='<b style="font-size:17px">'+(cur?'Сотрудник':'Новый сотрудник')+'</b>'+
'<label>ФИО</label><input id="f-name" value="'+esc(e.name)+'">'+
'<label>Отделение</label><select id="f-unit">'+uo+'</select>'+
'<label>Должность</label><select id="f-role"><option value="doc"'+(e.role==="doc"?' selected':'')+'>Врач</option><option value="asst"'+(e.role==="asst"?' selected':'')+'>Ассистент</option></select>'+
'<label>Статус</label><select id="f-status"><option value="work"'+(e.status==="work"?' selected':'')+'>Работает</option><option value="intern"'+(e.status==="intern"?' selected':'')+'>Стажируется</option></select>'+
'<label>Дата выхода / начала стажировки</label><input type="date" id="f-start" value="'+esc(e.start)+'">'+
'<label>Стажировка до</label><input type="date" id="f-end" value="'+esc(e.internEnd)+'">'+
'<label>Наставник</label><input id="f-mentor" value="'+esc(e.mentor)+'">'+
'<label>Телефон</label><input id="f-phone" type="tel" value="'+esc(e.phone)+'">'+
'<label>Заметка</label><textarea id="f-note" rows="3">'+esc(e.note)+'</textarea>'+
'<div class="btns"><button id="b-c">Отмена</button>'+(cur?'<button class="dl" id="b-d">Удалить</button>':'')+'<button class="pr" id="b-s">Сохранить</button></div>';
$("m").classList.add("on")}
function closeM(){$("m").classList.remove("on")}
async function saveE(){var n=$("f-name").value.trim();if(!n){$("f-name").focus();return}
var o={name:n,unit:$("f-unit").value,role:$("f-role").value,status:$("f-status").value,start:$("f-start").value,internEnd:$("f-end").value,mentor:$("f-mentor").value.trim(),phone:$("f-phone").value.trim(),note:$("f-note").value.trim()};
try{if(cur)o.id=cur;await api("POST","/api/staff",o);await load();closeM()}catch(x){warn("Не удалось сохранить: "+(x&&x.message||x))}}
async function delE(){if(!delArm){delArm=true;$("b-d").textContent="Точно удалить?";return}
try{await api("DELETE","/api/staff/"+cur);await load();closeM()}catch(x){warn("Не удалось удалить")}}
function warn(t){$("warn").innerHTML=t?'<div class="warn">'+esc(t)+'</div>':""}
function saveNeeds(){clearTimeout(tmr);tmr=setTimeout(async function(){try{await api("PUT","/api/needs",needs)}catch(x){warn("Не удалось сохранить план")}},500)}
document.addEventListener("click",function(ev){var t=ev.target,b=t.closest("button"),e=t.closest("[data-e]");
if(t.id==="m"){closeM();return}
if(b&&b.id==="b-c"){closeM();return}if(b&&b.id==="b-s"){saveE();return}if(b&&b.id==="b-d"){delE();return}
if(b&&b.dataset.t){tab=b.dataset.t;render();return}
if(b&&b.dataset.n){var k=b.dataset.n;needs[k]=Math.max(0,(needs[k]||0)+Number(b.dataset.d));render();saveNeeds();return}
if(b&&b.dataset.add){openM(null,b.dataset.add,b.dataset.r);return}
if(e){var s=staff.filter(function(x){return x.id===e.dataset.e})[0];if(s)openM(s)}});
render();
var TG=window.Telegram&&Telegram.WebApp;if(TG){TG.ready();TG.expand()}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","Authorization":"tma "+(TG?TG.initData:"")},body:b?JSON.stringify(b):undefined});
if(r.status===403)throw new Error("Нет доступа: ваш ID не в списке");if(!r.ok)throw new Error("Ошибка "+r.status);return r.json()}
async function load(){try{var d=await api("GET","/api/data");staff=d.staff;needs=d.needs;warn("");render()}catch(x){warn(x.message)}}
load();
</script></body></html>
